spring:
  application:
    name: liu-ai-agent
  profiles:
    active: local
  ai:
    dashscope:
      api-key: your-api-key
      chat:
        options:
          model: qwen-plus

    mcp:
      client:
#        stdio:
#          servers-configuration: classpath:mcp-servers.json
         sse:
           connections:
             server1:
               url: http://localhost:8127


server:
  port: 8123
  servlet:
    context-path: /api

# springdoc-openapi ??????
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.lyh.liuaiagent.controller
# knife4j???????????????
knife4j:
  enable: true
  setting:
    language: zh_cn

#Search API
search-api:
  api-key: 你的API Key