spring:
  application:
    name: liu-ai-agent
  profiles:
    active: local
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      chat:
        options:
          model: ${DASHSCOPE_CHAT_MODEL:qwen3.8-max}
          # Qwen3.8 使用多模态接口；切换回仅支持文本的模型时设为 false。
          multi-model: ${DASHSCOPE_CHAT_MULTI_MODEL:true}
  datasource:
    url: ${CHAT_DATABASE_URL:jdbc:h2:file:./tmp/data/liu-ai-agent;MODE=MySQL;AUTO_SERVER=TRUE}
    driver-class-name: org.h2.Driver
    username: ${CHAT_DATABASE_USERNAME:root}
    password: ${CHAT_DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

#    mcp:
#      client:
##        stdio:
##          servers-configuration: classpath:mcp-servers.json
#         sse:
#           connections:
#             server1:
#               url: http://localhost:8127


server:
  port: 8123
  servlet:
    context-path: /api

auth:
  jwt:
    secret: ${AUTH_JWT_SECRET:}
    expiration-ms: ${AUTH_JWT_EXPIRATION_MS:7200000}
  bootstrap-admin:
    username: ${AUTH_BOOTSTRAP_ADMIN_USERNAME:admin}
    password: ${AUTH_BOOTSTRAP_ADMIN_PASSWORD:}
  upload:
    dir: ${AUTH_UPLOAD_DIR:${user.dir}/tmp/uploads}
    max-size-bytes: ${AUTH_UPLOAD_MAX_SIZE_BYTES:2097152}
  cos:
    enabled: ${TENCENT_COS_ENABLED:false}
    secret-id: ${TENCENT_COS_SECRET_ID:}
    secret-key: ${TENCENT_COS_SECRET_KEY:}
    region: ${TENCENT_COS_REGION:ap-shanghai}
    bucket: ${TENCENT_COS_BUCKET:}
    public-base-url: ${TENCENT_COS_PUBLIC_BASE_URL:}

# springdoc-openapi
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.lyh.liuaiagent.controller
# knife4j???????????????
knife4j:
  enable: true
  setting:
    language: zh_cn

#Search API
search-api:
  api-key: ${SEARCH_API_KEY:}
