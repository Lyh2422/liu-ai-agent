name: liu-ai-agent-mysql

services:
  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: liu_ai_agent
      MYSQL_USER: ${CHAT_DATABASE_USERNAME:-liu_ai_agent}
      MYSQL_PASSWORD: ${CHAT_DATABASE_PASSWORD:-liu_ai_agent_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-liu_ai_agent_root_dev}
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - liu_ai_agent_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  liu_ai_agent_mysql:
