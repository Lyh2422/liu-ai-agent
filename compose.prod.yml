name: liu-ai-agent-prod

services:
  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: liu_ai_agent
      MYSQL_USER: ${CHAT_DATABASE_USERNAME:-liu_ai_agent}
      MYSQL_PASSWORD: ${CHAT_DATABASE_PASSWORD:?CHAT_DATABASE_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - liu_ai_agent_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ${PROD_ENV_FILE:-.env.prod}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CHAT_DATABASE_URL: jdbc:mysql://database:3306/liu_ai_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - liu_ai_agent_files:/app/tmp
    restart: unless-stopped

  frontend:
    build:
      context: ./liu-ai-agent-frontend
      dockerfile: Dockerfile.demo
      args:
        VITE_API_BASE_URL: /api
    depends_on:
      - backend
    ports:
      - ${APP_PORT:-8080}:80
    restart: unless-stopped

volumes:
  liu_ai_agent_mysql:
  liu_ai_agent_files:
